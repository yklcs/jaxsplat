[project]
name = "jaxsplat-ffi"
version = "0.2.0"
description = "jaxsplat Gaussian-splatting rasterizer on JAX's XLA FFI (works with JAX >= 0.6), with batched vmap rendering"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE.txt", "COPYRIGHT.txt"]
authors = [
    { name = "Lucas Yunkyu Lee", email = "lucas@yklcs.com" },
    { name = "Dominik Woiwode", email = "woiwode@tnt.uni-hannover.de" },
]
dependencies = ["jax>=0.6", "numpy"]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.6"]
cuda13 = ["jax[cuda13]>=0.6"]

[build-system]
requires = ["hatchling>=1.26", "jax>=0.6"]  # jax: XLA FFI headers for compiling
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxsplat_ffi"]

# Compiles the CUDA library during the build (see hatch_build.py).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
